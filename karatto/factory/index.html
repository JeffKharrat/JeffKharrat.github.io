<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>大工場 · カラット</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;600;700&family=M+PLUS+1+Code:wght@400;500;700&family=Tektur:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* the look: Marathon-style graphic sci-fi. Black, hairlines, micro labels, one acid yellow, the AI's blue, red for faults.
   Kanji in M PLUS 1 at medium weight: dense characters stay readable. */
:root { --y:#FFE600; --y2:#FFF27A; --red:#FF3B30; --ai:#4A5BFF; --ink:#ECEEF2; --mute:#8A909C; --line:#2A2E36; --line2:#3A3F48; --panel:rgba(7,8,10,.94);
  --kj:'M PLUS 1',sans-serif; --mono:'M PLUS 1 Code',monospace; --num:'Tektur',sans-serif; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#030304; color:var(--ink); font:400 14px/1.45 var(--mono); overflow:hidden; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#stage { position:relative; width:1280px; height:720px; transform-origin:center; flex:none; overflow:hidden; background:#08090B; }
#cv { position:absolute; inset:0; width:1280px; height:720px; }
#stage::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:20; background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.12) 2px 3px); mix-blend-mode:multiply; }
button { font:inherit; color:inherit; }
.lb { font:500 10px/1.3 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--mute); }
.kj { font-family:var(--kj); font-weight:500; }
.key { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:20px; padding:0 5px; border:1px solid var(--line2); font:700 10px var(--mono); color:#C9CDD6; }
.bc { display:inline-block; width:64px; height:12px; background:repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 3px, currentColor 3px 5px, transparent 5px 6px, currentColor 6px 7px, transparent 7px 10px); opacity:.5; }

/* top bar */
#top { position:absolute; left:0; right:0; top:0; height:50px; display:flex; align-items:center; gap:18px; padding:0 16px; background:#050506; border-bottom:1px solid var(--line); z-index:5; }
#top .t { display:flex; align-items:center; gap:10px; }
#top .t .tag { background:var(--y); color:#000; font:700 10px var(--mono); letter-spacing:.12em; padding:3px 6px; }
#top .t b { font:600 19px var(--kj); }
#clock { font:700 24px var(--num); letter-spacing:.06em; min-width:80px; }
#prog { flex:1; height:8px; position:relative; background:repeating-linear-gradient(90deg, #1A1D22 0 10px, transparent 10px 12px); }
#prog i { position:absolute; left:0; top:0; bottom:0; width:0; background:repeating-linear-gradient(90deg, var(--y) 0 10px, transparent 10px 12px); transition:width .4s; }
#prog b { position:absolute; top:-5px; width:2px; height:18px; background:var(--ink); }
#prog b::after { content:'TARGET'; position:absolute; left:5px; top:-1px; font:500 8px var(--mono); letter-spacing:.14em; color:var(--mute); }
#top .st { display:flex; gap:14px; font:700 13px var(--num); }
#top .st span em { font:500 10px var(--mono); font-style:normal; color:var(--mute); margin-right:6px; letter-spacing:.1em; }
.tb { background:transparent; border:1px solid var(--line2); padding:6px 10px; font:500 10px var(--mono); color:var(--mute); cursor:pointer; letter-spacing:.12em; }
.tb:hover { color:#000; background:var(--y); border-color:var(--y); }

/* kanban cards over the stations */
.card { position:absolute; top:64px; width:232px; height:164px; padding:10px 12px 0; background:var(--panel); border:1px solid var(--line2); display:flex; flex-direction:column; gap:4px; cursor:pointer; z-index:4;
  animation:drop .45s cubic-bezier(.2,1.3,.4,1) both; transition:border-color .2s, opacity .2s; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.card .code { position:absolute; left:0; top:0; background:#22252B; color:var(--mute); font:700 9px var(--mono); letter-spacing:.14em; padding:3px 6px; }
.card.on { border-color:var(--y); } .card.on .code { background:var(--y); color:#000; }
.card.wait { opacity:.55; }
.card.auto .code { background:var(--ai); color:#fff; }
.card .h { display:flex; justify-content:flex-end; align-items:center; gap:8px; min-height:16px; }
.card .p { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; }
.card .p.kana { font:500 33px var(--kj); letter-spacing:.04em; }
.card .p.en { font:700 19px/1.25 var(--mono); }
.card .p.kj { font:500 54px/1 var(--kj); }
.card .f { display:flex; justify-content:space-between; align-items:center; font:500 9.5px var(--mono); letter-spacing:.08em; color:var(--mute); padding-bottom:6px; }
.card .tm { height:5px; margin:0 -12px; background:#15171B; position:relative; }
.card .tm s { position:absolute; left:0; top:0; bottom:0; width:100%; background:repeating-linear-gradient(90deg, var(--y) 0 8px, transparent 8px 10px); }
.card.auto .tm s { background:repeating-linear-gradient(90deg, var(--ai) 0 8px, transparent 8px 10px); }
.card .tm s.hot { background:repeating-linear-gradient(90deg, var(--red) 0 8px, transparent 8px 10px); }
.card .ok, .card .ng { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.card .ok { background:#0B0C05; } .card .ng { background:#140605; }
.card .sx { position:absolute; left:0; top:0; right:0; padding:4px 8px; font:700 10px var(--mono); letter-spacing:.16em; color:#000; background:var(--y); display:flex; justify-content:space-between; animation:wipe .25s ease-out both; }
.card .sx b { font:600 13px/1 var(--kj); }
.card .ng .sx { background:var(--red); color:#fff; }
.card.auto .ok .sx { background:var(--ai); color:#fff; }
.card .ans { text-align:center; animation:fade .3s .08s both; margin-top:12px; }
.card .ans b { display:block; font:500 36px/1.15 var(--kj); color:var(--ink); }
.card .ans span { display:block; font:500 12px/1.4 var(--mono); color:#C9CDD6; max-width:206px; }
.card.leave { animation:leave .4s ease-in both; }
.card.shake { animation:shake .4s; }
@keyframes drop { from { transform:translateY(-30px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes leave { to { transform:translateY(-24px); opacity:0; } }
@keyframes wipe { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0); } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes shake { 20% { transform:translateX(-7px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(2px); } }

/* side panels */
.side { position:absolute; top:64px; background:rgba(5,5,6,.86); border:1px solid var(--line); z-index:3; font-size:11px; line-height:1.7; padding:9px 11px; }
#left { left:10px; width:188px; }
#log { right:10px; width:180px; max-height:190px; overflow:hidden; }
.side .hd { white-space:nowrap; gap:8px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:5px; }
#log div.e { display:flex; justify-content:space-between; gap:6px; animation:fade .3s ease-out both; white-space:nowrap; }
#log div.e span:first-child { overflow:hidden; text-overflow:ellipsis; }
#log .kj { font-size:12.5px; }
.y { color:var(--y); } .r { color:var(--red); } .a { color:#8C98FF; } .m { color:var(--mute); }

/* the bins: a numpad. 4 5 6 over 1 2 3 */
#bins { position:absolute; left:14px; right:14px; bottom:12px; height:136px; display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:1fr 1fr; gap:8px; z-index:4; }
.bin { position:relative; background:linear-gradient(#0E0F12, #090A0C); border:1px solid var(--line2); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:4px 46px;
  transition:transform .08s, border-color .15s, background .15s; clip-path:polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
.bin:hover { border-color:#6A6420; }
.bin .k { position:absolute; left:0; top:0; bottom:0; width:38px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:1px solid var(--line); background:#121317; }
.bin .k b { font:700 18px var(--num); color:var(--ink); line-height:1; }
.bin .k small { font:500 7.5px var(--mono); letter-spacing:.14em; color:var(--mute); margin-top:3px; }
.bin .v { transition:transform .22s, opacity .22s; text-align:center; overflow:hidden; }
.bin .v.jp { font:500 29px/1.1 var(--kj); }
.bin .v.en { font:700 13.5px/1.25 var(--mono); }
.bin.flip .v { transform:translateY(-60%); opacity:0; }
.bin.press { transform:translateY(2px); }
.bin.good { border-color:var(--y); background:#16160A; } .bin.good .k { background:var(--y); } .bin.good .k b, .bin.good .k small { color:#000; }
.bin.bad { border-color:var(--red); background:#1A0907; } .bin.bad .k { background:var(--red); }
.bin.show { border-color:var(--y); } .bin.show::after { content:'正解 // CORRECT'; position:absolute; right:14px; top:5px; font:700 9px var(--mono); letter-spacing:.12em; color:var(--y); }
.bin.off { opacity:.3; pointer-events:none; }
.bin.off .v:empty::before { content:'— STANDBY —'; font:500 10px var(--mono); letter-spacing:.2em; color:var(--mute); }

/* overlays: the brief and the report */
.ov { position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(3,3,4,.78); }
.ov.on { display:flex; animation:fade .3s ease-out both; }
.sheet { width:840px; max-height:660px; overflow:auto; background:#060607; border:1px solid var(--line2); padding:0 28px 22px; animation:drop .4s cubic-bezier(.2,1.2,.4,1) both; }
.sheet .bar { margin:0 -28px 16px; display:flex; justify-content:space-between; align-items:center; padding:7px 28px; background:var(--y); color:#000; font:700 10px var(--mono); letter-spacing:.16em; }
.sheet h2 { margin:2px 0 8px; font:600 34px/1.1 var(--kj); }
.sheet .row { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; margin:14px 0; }
.sheet .stat { border:1px solid var(--line); border-top:2px solid var(--line2); padding:10px 12px; }
.sheet .stat b { display:block; font:700 30px var(--num); }
.sheet .how { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin:14px 0; }
.sheet .how div { border:1px solid var(--line); padding:11px 12px; font-size:12px; color:#C9CDD6; }
.sheet .how b { display:block; font:600 19px var(--kj); color:var(--ink); margin-bottom:4px; }
.sheet .how em { font-style:normal; font:700 9px var(--mono); letter-spacing:.14em; color:var(--y); display:block; margin-bottom:4px; }
.go { background:var(--y); color:#000; border:0; padding:12px 20px; font:700 13px var(--mono); cursor:pointer; letter-spacing:.06em; clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
.go:hover { background:var(--y2); }
.go .key { border-color:#000; color:#000; margin-left:6px; }
.go2 { background:transparent; color:var(--ink); border:1px solid var(--line2); padding:11px 18px; font:700 13px var(--mono); cursor:pointer; }
.go2:hover { border-color:var(--y); }
.acts { display:flex; gap:10px; margin-top:16px; align-items:center; }
.ev { display:grid; grid-template-columns:1fr 1fr; gap:2px 18px; font-size:11.5px; margin-top:8px; }
.ev div { display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid #16181C; padding:3px 0; }
.ev .kj { font-size:16px; }
.shop { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin-top:8px; }
.shop button { text-align:left; background:#0B0C0E; border:1px solid var(--line); padding:11px 12px; cursor:pointer; font-size:11.5px; color:#C9CDD6; }
.shop button b { display:block; font:600 17px var(--kj); color:var(--ink); }
.shop button:hover:not(:disabled) { border-color:var(--y); }
.shop button:disabled { opacity:.45; cursor:default; }
.files { margin-top:14px; padding:10px 14px; border:1px solid var(--ai); border-left:4px solid var(--ai); color:#C9CDD6; font-size:12px; }
.files .kj { font-size:14px; color:var(--ink); }
#toast { position:absolute; left:50%; top:244px; transform:translateX(-50%); z-index:6; padding:8px 14px; background:var(--panel); border:1px solid var(--line); font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
#toast.on { opacity:1; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="1280" height="720" aria-hidden="true"></canvas>
  <div id="top">
    <div class="t"><span class="tag">FAC-01</span><b>大工場</b><span class="lb">Great Factory · Line 01 · 第一ライン</span></div>
    <span id="clock">03:00</span>
    <div id="prog" title="Shipped against the shift's target"><i></i><b></b></div>
    <div class="st"><span><em>出荷 SHIP</em><span id="s-ship">0</span></span><span><em>不良 DEF</em><span id="s-def">0</span></span><span><em>¥</em><span id="s-yen">0</span></span></div>
    <button class="tb" id="b-mute" type="button" aria-label="Sound on or off">SND ON</button>
    <button class="tb" id="b-exit" type="button">地上 · EXIT</button>
  </div>
  <div class="side" id="left"></div>
  <div class="side" id="log" aria-live="polite"></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="toast"></div>
  <div class="ov" id="ov-brief"><div class="sheet" id="brief"></div></div>
  <div class="ov" id="ov-report"><div class="sheet" id="report"></div></div>
</div></div>
<script type="module" src="../../js/karatto/factory.js?v=2"></script>
</body>
</html>
