<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>大工場 · カラット</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@400;500;700&family=Tektur:wght@500;800&display=swap" rel="stylesheet">
<style>
:root { --y:#FFC400; --y2:#FFD84D; --red:#FF5A3D; --ai:#4A5BFF; --ink:#E9EBF0; --mute:#9AA1B0; --line:#2F3541; --panel:rgba(13,15,20,.92); --jp:'Dela Gothic One',sans-serif; --mono:'M PLUS 1 Code',monospace; --num:'Tektur',sans-serif; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#050608; color:var(--ink); font:400 14px/1.45 var(--mono); overflow:hidden; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#stage { position:relative; width:1280px; height:720px; transform-origin:center; flex:none; overflow:hidden; background:#0B0E13; }
#cv { position:absolute; inset:0; width:1280px; height:720px; }
button { font:inherit; color:inherit; }
.lb { font:500 11px/1.3 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.jp { font-family:var(--jp); font-weight:400; }
.key { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 4px; border:1px solid #4A5160; font:700 11px var(--mono); color:#C9CDD6; }

/* top bar */
#top { position:absolute; left:0; right:0; top:0; height:52px; display:flex; align-items:center; gap:20px; padding:0 18px; background:linear-gradient(#0B0D11, rgba(11,13,17,.86)); border-bottom:1px solid var(--line); z-index:5; }
#top .t { display:flex; align-items:baseline; gap:10px; }
#clock { font:800 24px var(--num); letter-spacing:.04em; min-width:74px; }
#prog { flex:1; height:6px; background:#20242D; position:relative; }
#prog i { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--y); transition:width .4s; }
#prog b { position:absolute; top:-3px; width:2px; height:12px; background:var(--ink); }
#top .st { display:flex; gap:16px; font:700 13px var(--mono); }
#top .st span em { font-style:normal; color:var(--mute); font-weight:500; margin-right:6px; }
.tb { background:transparent; border:1px solid #3A4150; padding:6px 10px; font:500 11px var(--mono); color:var(--mute); cursor:pointer; letter-spacing:.06em; }
.tb:hover { color:var(--ink); border-color:var(--y); }

/* kanban cards over the stations */
.card { position:absolute; top:70px; width:228px; height:156px; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-top:3px solid #3A4150; display:flex; flex-direction:column; gap:4px; cursor:pointer; z-index:4;
  animation:drop .5s cubic-bezier(.2,1.4,.4,1) both; transition:border-color .2s, opacity .2s, transform .2s; }
.card.on { border-color:#5A5030; border-top-color:var(--y); box-shadow:0 0 0 1px rgba(255,196,0,.25), 0 10px 30px rgba(0,0,0,.5); }
.card.wait { opacity:.62; }
.card.auto { border-top-color:var(--ai); }
.card .h { display:flex; justify-content:space-between; align-items:center; }
.card .p { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; }
.card .p.kana { font:700 34px var(--mono); letter-spacing:.06em; }
.card .p.en { font:700 21px/1.25 var(--mono); }
.card .p.kj { font:400 52px/1 var(--jp); }
.card .f { display:flex; justify-content:space-between; font:500 10.5px var(--mono); color:var(--mute); }
.card svg { width:26px; height:26px; transform:rotate(-90deg); }
.card .ok, .card .ng { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.card .ok { background:linear-gradient(#1C1908, #0F0E08); }
.card .ng { background:linear-gradient(#24110D, #120A09); }
.card .sx { position:absolute; right:10px; top:6px; font:400 34px/1 var(--jp); transform:rotate(-8deg); animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both; opacity:.95; }
.card .ok .sx { color:var(--y); } .card .ng .sx { color:var(--red); }
.card .ans { text-align:center; animation:fade .3s .1s both; }
.card .ans b { display:block; font:400 34px/1.15 var(--jp); font-weight:400; color:var(--ink); }
.card .ans span { display:block; font:500 12.5px/1.4 var(--mono); color:#C9CDD6; max-width:200px; }
.card .ans em { display:block; font:500 10px var(--mono); font-style:normal; letter-spacing:.12em; color:var(--mute); margin-bottom:2px; }
.card.leave { animation:leave .45s ease-in both; }
.card.shake { animation:shake .4s; }
@keyframes drop { from { transform:translateY(-40px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes leave { to { transform:translateY(-30px) scale(.96); opacity:0; } }
@keyframes stamp { from { transform:scale(1.8) rotate(-8deg); opacity:0; } to { transform:none; opacity:1; } }
@keyframes shake { 20% { transform:translateX(-7px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(2px); } }

/* side panels */
#left { position:absolute; left:12px; top:66px; width:186px; padding:10px 12px; background:rgba(11,13,17,.8); border:1px solid var(--line); z-index:3; font-size:11.5px; line-height:1.65; }
#log { position:absolute; right:12px; top:66px; width:178px; max-height:186px; overflow:hidden; padding:10px 12px; background:rgba(11,13,17,.8); border:1px solid var(--line); z-index:3; font-size:11.5px; line-height:1.7; }
#log div { display:flex; justify-content:space-between; gap:6px; animation:drop .3s ease-out both; white-space:nowrap; }
#log div span:first-child { overflow:hidden; text-overflow:ellipsis; }
.y { color:var(--y); } .r { color:var(--red); } .a { color:#8C98FF; } .m { color:var(--mute); }

/* the bins: the parts, as keycaps */
#bins { position:absolute; left:16px; right:16px; bottom:16px; height:128px; display:flex; gap:10px; z-index:4; }
.bin { flex:1; position:relative; background:linear-gradient(#171A21, #101318); border:1px solid #343A46; border-bottom:4px solid #262B35; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; padding:10px 8px 8px;
  transition:transform .08s, border-color .15s, background .15s; perspective:600px; }
.bin:hover { border-color:#5A5030; }
.bin .key { position:absolute; left:8px; top:8px; }
.bin .v { transition:transform .25s, opacity .25s; text-align:center; }
.bin .v.jp { font-size:30px; line-height:1.15; }
.bin .v.en { font:700 14px/1.3 var(--mono); padding:0 6px; }
.bin.flip .v { transform:rotateX(90deg); opacity:0; }
.bin.press { transform:translateY(4px); border-bottom-width:1px; }
.bin.good { border-color:var(--y); background:linear-gradient(#2A240C, #15130A); }
.bin.bad { border-color:var(--red); background:linear-gradient(#2A120E, #150B0A); }
.bin.show::after { content:'正解'; position:absolute; right:8px; top:6px; font:400 12px var(--jp); color:var(--y); }
.bin.off { opacity:.25; pointer-events:none; }
.bin.off .v:empty::before { content:'待機'; font:400 13px var(--jp); color:var(--mute); }
.bin i { position:absolute; left:10px; right:10px; bottom:-4px; height:3px; background:transparent; transition:background .15s; }
.bin.hot i { background:var(--y); }

/* overlays: the brief and the report */
.ov { position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(5,6,8,.72); backdrop-filter:blur(3px); }
.ov.on { display:flex; animation:fade .35s ease-out both; }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
.sheet { width:820px; max-height:640px; overflow:auto; background:#0E1116; border:1px solid var(--line); border-top:3px solid var(--y); padding:28px 32px; animation:drop .45s cubic-bezier(.2,1.3,.4,1) both; }
.sheet h2 { margin:4px 0 8px; font:400 34px/1.1 var(--jp); }
.sheet .row { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:14px 0; }
.sheet .stat { border:1px solid var(--line); padding:12px; }
.sheet .stat b { display:block; font:800 30px var(--num); }
.sheet .how { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:16px 0; }
.sheet .how div { border:1px solid var(--line); padding:12px; font-size:12.5px; color:#C9CDD6; }
.sheet .how b { display:block; font:400 20px var(--jp); color:var(--ink); margin-bottom:4px; }
.go { background:var(--y); color:#111; border:0; padding:13px 22px; font:700 14px var(--mono); cursor:pointer; letter-spacing:.04em; }
.go:hover { background:var(--y2); }
.go2 { background:transparent; color:var(--ink); border:1px solid #4A5160; padding:12px 20px; font:700 14px var(--mono); cursor:pointer; }
.go2:hover { border-color:var(--y); }
.acts { display:flex; gap:10px; margin-top:18px; align-items:center; }
.ev { display:grid; grid-template-columns:1fr 1fr; gap:2px 18px; font-size:12px; margin-top:8px; }
.ev div { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid #1C2028; padding:3px 0; }
.shop { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin-top:8px; }
.shop button { text-align:left; background:#12151B; border:1px solid var(--line); padding:12px; cursor:pointer; font-size:12px; color:#C9CDD6; }
.shop button b { display:block; font:400 17px var(--jp); color:var(--ink); }
.shop button:hover:not(:disabled) { border-color:var(--y); }
.shop button:disabled { opacity:.45; cursor:default; }
.files { margin-top:14px; padding:12px 14px; border:1px solid var(--ai); color:#C9CDD6; font-size:12.5px; }
#toast { position:absolute; left:50%; top:244px; transform:translateX(-50%); z-index:6; padding:8px 14px; background:var(--panel); border:1px solid var(--line); font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
#toast.on { opacity:1; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="1280" height="720" aria-hidden="true"></canvas>
  <div id="top">
    <div class="t"><span class="jp" style="font-size:20px">大工場</span><span class="lb">Great Factory · 第一ライン</span></div>
    <span id="clock">03:00</span>
    <div id="prog" title="Shipped against the shift's target"><i></i><b></b></div>
    <div class="st"><span><em>出荷</em><span id="s-ship">0</span></span><span><em>不良</em><span id="s-def">0</span></span><span><em>¥</em><span id="s-yen">0</span></span></div>
    <button class="tb" id="b-mute" type="button" aria-label="Sound on or off">音 ON</button>
    <button class="tb" id="b-exit" type="button">地上 · Exit</button>
  </div>
  <div id="left"></div>
  <div id="log" aria-live="polite"></div>
  <div id="cards"></div>
  <div id="bins"></div>
  <div id="toast"></div>
  <div class="ov" id="ov-brief"><div class="sheet" id="brief"></div></div>
  <div class="ov" id="ov-report"><div class="sheet" id="report"></div></div>
</div></div>
<script type="module" src="../../js/karatto/factory.js?v=1"></script>
</body>
</html>
